<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Memory Book | NARA STUDIO</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans&display=swap" rel="stylesheet"><link rel="stylesheet" href="../demo.css"></head>
<body><main><p>Memory book untuk</p><h1><span data-nara="to">Nama Kamu</span> 📖</h1><div id="pg" aria-live="polite"></div>
<div style="display:flex;gap:.6rem;justify-content:center;align-items:center"><button id="pv" aria-label="Halaman sebelumnya">←</button><span id="ct"></span><button id="nx" aria-label="Halaman berikutnya">→</button></div></main>
<span class="o" style="left:5%;top:20%">📸</span><span class="o" style="left:90%;top:25%;animation-delay:-1s">⭐</span><span class="o" style="left:6%;top:75%;animation-delay:-2s">🧸</span><span class="o" style="left:88%;top:78%;animation-delay:-.5s">🌼</span>
<script>const P=[["Awal cerita","🌷","Foto pertama kita","☁️","Hari yang tenang"],["Jalan-jalan","🍓","Es krim favorit","🎈","Tertawa tanpa alasan"],["Momen kecil","🎀","Kado kejutan","✨","Malam yang hangat"],["Sampai nanti","💌","Surat untukmu","🧸","Terima kasih ya"]],C=[["--pink","--lav"],["--butter","--peach"],["--mint","--sky"],["--lav","--pink"]];let i=0;const g=id=>document.getElementById(id);
function r(){const p=P[i];g("pg").innerHTML=`<h2>${p[0]}</h2><div class="pols"><div class="pol" style="--r:-4deg;--c1:var(${C[i][0]});--c2:var(${C[i][1]})"><i>${p[1]}</i>${p[2]}</div><div class="pol" style="--r:3deg;--c1:var(${C[i][1]});--c2:var(${C[i][0]})"><i>${p[3]}</i>${p[4]}</div></div><div class="note" style="--r:-1deg" ${i==3?'data-nara="msg"':""}>Teks demo, ganti dengan ceritamu.</div>`;g("ct").textContent=`${i+1} / ${P.length}`;g("pv").disabled=!i;g("nx").disabled=i==P.length-1;document.dispatchEvent(new Event("nara:update"))}
g("pv").onclick=()=>{i--;r()};g("nx").onclick=()=>{i++;r()};r()</script>
<script src="../nara-editor.js"></script></body></html>
