<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Birthday | NARA STUDIO</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@500;600&family=DM+Sans&display=swap" rel="stylesheet">
<style>:root{--c:#F8F4EC;--r:#D8B8B2;--e:#352B28;--b:#79685C}body{margin:0;font-family:'DM Sans',sans-serif;background:var(--c);color:var(--e);text-align:center;min-height:100vh}
.bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:.6rem 1rem;background:var(--e);color:#fff;font-size:.8rem;z-index:5}.bar a{color:#fff;border:1px solid #fff;padding:.3rem .8rem;border-radius:99px;text-decoration:none}
h1{font:600 clamp(2.2rem,8vw,4rem) 'Cormorant Garamond',serif;margin:.5rem}main{padding:2.5rem 1rem;max-width:560px;margin:auto}p{color:var(--b)}
.cake{margin:1.5rem auto;width:150px}.cake i{display:block;height:50px;background:var(--r);border-radius:8px;margin-top:4px;box-shadow:0 8px 20px rgba(53,43,40,.15)}.cake i+i{width:80%;margin:4px auto 0;background:#E3CFC4}
.candle{width:8px;height:34px;background:#fff;margin:0 auto -4px;position:relative;border:1px solid var(--r)}.flame{position:absolute;top:-16px;left:-1px;width:10px;height:14px;background:#f5b84a;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;animation:f .4s infinite alternate}.out .flame{display:none}@keyframes f{to{transform:scale(1.15) rotate(4deg)}}
button{padding:.7rem 1.4rem;border:1px solid var(--e);border-radius:99px;background:var(--e);color:#fff;font:inherit;cursor:pointer}
.cards{display:grid;gap:1.2rem;margin-top:2rem;opacity:0;transition:1s}.cards.show{opacity:1}.note{background:#fff;padding:1rem 1.2rem;box-shadow:0 8px 24px rgba(53,43,40,.1);transform:rotate(var(--r));font:italic 1.3rem 'Cormorant Garamond',serif;position:relative}
.note:before{content:"";position:absolute;top:-8px;left:42%;width:50px;height:16px;background:rgba(216,184,178,.85)}body{background:linear-gradient(180deg,#F9C6D0,#FFE9A8 60%,#C8EBD8);background-attachment:fixed}h1{color:#E5718A}.bar{background:#E5718A}.cake i{background:#F9C6D0;border:2px solid #352B28}.cake i+i{background:#C9E2F8}.note{border:2px dashed #E5718A;border-radius:18px}.note:nth-child(2){background:#FFF6D6}.note:nth-child(3){background:#E7F7EF}button{background:#E5718A;border:2px solid #352B28;box-shadow:3px 3px 0 #352B28;font-weight:600}.o{position:fixed;font-size:26px;animation:bn 3s ease-in-out infinite;pointer-events:none}@keyframes bn{50%{transform:translateY(-12px) rotate(8deg)}}</style></head>
<body><main><p>Untuk: <span data-nara="to">Nama Kamu</span></p><h1>Happy Birthday, <span data-nara="to">Nama Kamu</span>!</h1><div class="cake" id="cake"><div class="candle"><div class="flame"></div></div><i></i><i></i></div>
<button id="b">Tiup lilinnya 🕯</button><p id="h"></p>
<div class="cards" id="cs"><div class="note" style="--r:-2deg">Semoga semua hal baik datang padamu.</div><div class="note" style="--r:1.5deg">Terima kasih sudah jadi bagian ceritaku.</div><div class="note" data-nara="msg" style="--r:-1deg">Teks demo, ganti dengan pesan personal.</div></div></main><span class="o" aria-hidden="true" style="left:4%;top:18%;animation-delay:-0s">🎀</span><span class="o" aria-hidden="true" style="left:88%;top:24%;animation-delay:-1s">🎈</span><span class="o" aria-hidden="true" style="left:6%;top:62%;animation-delay:-2s">🧁</span><span class="o" aria-hidden="true" style="left:90%;top:70%;animation-delay:-0.5s">⭐</span><span class="o" aria-hidden="true" style="left:46%;top:90%;animation-delay:-1.5s">🍓</span><span class="o" aria-hidden="true" style="left:80%;top:8%;animation-delay:-2.5s">✨</span>
<script>const b=document.getElementById("b");b.onclick=()=>{document.getElementById("cake").classList.add("out");document.getElementById("cs").classList.add("show");document.getElementById("h").textContent="Make a wish ✦";b.hidden=true}</script><script src="../nara-editor.js"></script></body></html>
